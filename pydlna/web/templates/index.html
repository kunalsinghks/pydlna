<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }}</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --danger: #ef4444;
            --success: #10b981;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(59, 130, 246, 0.2);
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            margin: 0 0 20px 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            width: fit-content;
        }

        .dots-loader {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            position: relative;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            outline: none;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .path-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .path-item {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .path-item .remove-icon {
            color: var(--danger);
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .path-item:hover .remove-icon {
            opacity: 1;
        }

        input[type="text"] {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 18px;
            color: white;
            width: 100%;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            outline: none;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1e293b;
            border: 1px solid var(--accent);
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: translateY(100px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
        }

        /* Native App Specifics */
        .native-only {
            display: none;
        }

        body.is-native .native-only {
            display: block;
        }

        body.is-native .web-only {
            display: none;
        }
    </style>
</head>

<body id="body">
    <div class="container">
        <div class="header">
            <h1>PyDLNA</h1>
            <p>Premium Local Media Streaming</p>
        </div>

        <!-- Tab Navigation -->
        <div
            style="grid-column: 1 / -1; display: flex; gap: 20px; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 20px;">
            <h2 id="tab-browse" onclick="switchTab('browse')" style="cursor: pointer; color: var(--accent); margin: 0;">
                Browse Media</h2>
            <h2 id="tab-admin" onclick="switchTab('admin')"
                style="cursor: pointer; color: var(--text-secondary); margin: 0;">Server Admin</h2>
        </div>

        <!-- BROWSE TAB -->
        <div id="view-browse" style="grid-column: 1 / -1; display: block;">
            <div class="card">
                <div id="media-grid" class="grid"
                    style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px;">
                    <!-- Media Items Loaded Here -->
                    <p style="color: var(--text-secondary);">Loading library...</p>
                </div>
            </div>
        </div>

        <!-- ADMIN TAB -->
        <div id="view-admin" style="grid-column: 1 / -1; display: none;">
            <div class="grid">
                <!-- Server Identity Card -->
                <div class="card" style="grid-column: 1 / -1;">
                    <h2>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="2" y="2" width="20" height="8" rx="2" ry="2" />
                            <rect x="2" y="14" width="20" height="8" rx="2" ry="2" />
                            <line x1="6" y1="6" x2="6.01" y2="6" />
                            <line x1="6" y1="18" x2="6.01" y2="18" />
                        </svg>
                        Server Identity
                    </h2>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                        <div>
                            <label
                                style="display: block; font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 8px;">Display
                                Name</label>
                            <input type="text" id="server-name" placeholder="My Media Server">
                        </div>
                        <div>
                            <label
                                style="display: block; font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 8px;">Port
                                (URL Port)</label>
                            <input type="text" id="server-port" placeholder="8200">
                        </div>
                    </div>
                    <div style="margin-top: 20px;">
                        <button class="btn" style="width: 100%;" onclick="saveGeneralSettings()">Save Identity &
                            URL</button>
                    </div>
                </div>

                <!-- Status Card -->
                <div class="card" style="grid-column: 1 / -1;">
                    <h2>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20v-8m0 0V4m0 8h8m-8 0H4" />
                        </svg>
                        Server Control
                    </h2>
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
                        <div>
                            <div class="status-badge">
                                <div class="dots-loader"></div>
                                REACHABLE
                            </div>
                            <p style="margin: 12px 0 0 0; color: var(--text-secondary); font-size: 0.9rem;">
                                Network IP: <code style="color: var(--accent)">{{ request.base_url }}</code>
                            </p>
                        </div>
                        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                            <button class="btn btn-secondary" onclick="control('rescan')">Rescan</button>
                            <button class="btn" onclick="control('clear_cache')"
                                style="background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: #f87171;">Clear
                                Cache</button>
                            <button class="btn btn-danger" onclick="control('stop')">Stop</button>
                        </div>
                    </div>
                </div>

                <!-- Libraries Card -->
                <div class="card" style="grid-column: 1 / -1;">
                    <h2>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                        </svg>
                        Media Libraries
                    </h2>
                    <div id="path-list" class="path-list">
                        <!-- Loaded via JS -->
                    </div>

                    <div style="margin-top: 32px;">
                        <h3 style="font-size: 1rem; color: var(--text-secondary); margin-bottom: 12px;">Add New Library
                        </h3>
                        <div style="display: flex; gap: 12px;">
                            <input type="text" id="new-path" placeholder="C:\Users\Name\Videos" class="web-only">
                            <button class="btn" style="flex-shrink: 0;" onclick="handleDirAdd()">
                                <span class="web-only">Add Path</span>
                                <span class="native-only">Browse Folders</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <div id="toast" class="toast">Success!</div>

    <script>
        // Check if running in pywebview
        window.addEventListener('pywebviewready', function () {
            document.getElementById('body').classList.add('is-native');
            console.log("PyWebView detected");
        });

        // Tab Switching
        function switchTab(tab) {
            document.getElementById('view-browse').style.display = tab === 'browse' ? 'block' : 'none';
            document.getElementById('view-admin').style.display = tab === 'admin' ? 'block' : 'none';

            document.getElementById('tab-browse').style.color = tab === 'browse' ? 'var(--accent)' : 'var(--text-secondary)';
            document.getElementById('tab-admin').style.color = tab === 'admin' ? 'var(--accent)' : 'var(--text-secondary)';

            if (tab === 'browse') loadLibrary();
        }

        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                if (res.status === 401) {
                    window.location.reload(); // Force browser auth prompt
                    return;
                }
                const data = await res.json();
                renderPaths(data.media_paths);
                document.getElementById('server-name').value = data.friendly_name || '';
                document.getElementById('server-port').value = data.port || '8200';
            } catch (e) {
                console.error("Failed to load settings:", e);
            }
        }

        let mediaTree = {};
        let currentPath = [];
        let allItems = [];
        let configuredPaths = [];

        async function loadLibrary() {
            const grid = document.getElementById('media-grid');

            // 1. Get Configured Paths first
            try {
                const settingRes = await fetch('/api/settings');
                if (settingRes.ok) {
                    const data = await settingRes.json();
                    configuredPaths = data.media_paths.map(p => p.replace(/\\/g, '/'));
                }
            } catch (e) { console.error("Settings fail", e); }

            // 2. Get Media Items
            try {
                const res = await fetch('/api/library/browse');
                if (res.status === 401) {
                    window.location.reload();
                    return;
                }
                const items = await res.json();

                if (!Array.isArray(items)) {
                    console.error("Expected array but got:", items);
                    grid.innerHTML = '<p>Invalid server response.</p>';
                    return;
                }

                allItems = items;
                buildTree(items);
                renderCurrentPath();

            } catch (e) {
                console.error("Load lib failed", e);
                grid.innerHTML = '<p style="color: #ef4444;">Failed to load library: ' + e.message + '</p>';
            }
        }

        function buildTree(items) {
            mediaTree = {};

            // Normalize helper: consistent slashes, lowercase, remove trailing slash
            const normalize = (p) => {
                let n = p.replace(/\\/g, '/').toLowerCase();
                if (n.endsWith('/')) n = n.slice(0, -1);
                return n;
            };

            // Map normalized root path -> Original Display Path
            let rootMap = {};

            configuredPaths.forEach(rootPath => {
                const normRoot = normalize(rootPath);
                // Display Name: Last folder part or full path
                let name = rootPath.replace(/\\/g, '/').split('/').filter(p => p).pop() || rootPath;

                mediaTree[normRoot] = {
                    __type: 'folder',
                    __content: {},
                    __label: name,
                    __originalPath: rootPath
                };
                rootMap[normRoot] = true;
            });

            const fallbackKey = "unsorted";

            items.forEach(item => {
                const fullPath = item.file_path;
                const normFullPath = normalize(fullPath);

                // Find matching root
                let bestRootKey = null;
                let bestRootLen = 0;

                for (const rootKey in mediaTree) {
                    if (rootKey === fallbackKey) continue;

                    // To match, normFullPath must start with rootKey AND be followed by / or end of string
                    // We added strict slash check implicitly by logic below

                    if (normFullPath === rootKey || normFullPath.startsWith(rootKey + '/')) {
                        if (rootKey.length > bestRootLen) {
                            bestRootKey = rootKey;
                            bestRootLen = rootKey.length;
                        }
                    }
                }

                let targetRoot = "";
                let relativePath = "";

                if (bestRootKey) {
                    targetRoot = bestRootKey;
                    // Get the relative part by slicing off the root length
                    // We use original full path's length corresponding to the root's length logic?
                    // No, safe to just slice the normalized string and then use that structure?
                    // But we want to preserve original filename casing.
                    // Best way: Slice the original string by the length of the original root string.
                    // Assuming they align. If casing differs in drive letter, length is same.

                    const rootLen = mediaTree[bestRootKey].__originalPath.length;

                    // Adjust if root doesn't end in slash but file path does?
                    // standard: "C:/Movies" len=9. File: "C:/Movies/A.mkv".
                    // Slice(9) -> "/A.mkv".

                    // Robust slicing:
                    // Find the index of the slash after the root part?
                    // Let's just strip the prefix based on length, usually safe.
                    let rel = fullPath.slice(rootLen);

                    // Normalize separators in relative path for splitting
                    rel = rel.replace(/\\/g, '/');
                    if (rel.startsWith('/')) rel = rel.slice(1);
                    relativePath = rel;

                } else {
                    targetRoot = fallbackKey;
                    // Just use full path as structure
                    relativePath = fullPath.replace(/\\/g, '/').replace(':', '');

                    if (!mediaTree[fallbackKey]) {
                        mediaTree[fallbackKey] = {
                            __type: 'folder',
                            __content: {},
                            __label: "Unsorted / Other"
                        };
                    }
                    console.log(`Unsorted item: ${fullPath} (No root matched)`);
                }

                // Build sub-tree
                const parts = relativePath.split('/').filter(p => p);
                const fileName = parts.pop();

                let currentLevel = mediaTree[targetRoot].__content;

                // For folders, we want to try to keep original casing if possible.
                // But if we encounter "Movies" and "movies" later, we merge them.
                // We'll use a map of lowercase -> real key for this level to merge.
                // Actually, `mediaTree` structure above uses keys.

                // Helper to find existing key case-insensitively
                const getExistingKey = (obj, key) => {
                    const lowKey = key.toLowerCase();
                    for (const k in obj) {
                        if (k.toLowerCase() === lowKey) return k;
                    }
                    return null;
                };

                parts.forEach(part => {
                    let existing = getExistingKey(currentLevel, part);
                    let keyToUse = existing || part;

                    if (!currentLevel[keyToUse]) {
                        currentLevel[keyToUse] = { __type: 'folder', __content: {}, __label: keyToUse };
                    }
                    currentLevel = currentLevel[keyToUse].__content;
                });

                if (fileName) {
                    currentLevel[fileName] = { __type: 'file', ...item };
                }
            });
        }

        function renderCurrentPath() {
            const grid = document.getElementById('media-grid');
            grid.innerHTML = '';

            // Breadcrumbs
            const breadcrumbDiv = document.createElement('div');
            breadcrumbDiv.style.gridColumn = '1 / -1';
            breadcrumbDiv.style.padding = '10px 0';
            breadcrumbDiv.style.color = 'var(--text-secondary)';
            breadcrumbDiv.innerHTML = `<span onclick="navigateTo([])" style="cursor: pointer; color: var(--accent);">Home</span>`;

            let tempPath = [];
            currentPath.forEach(p => {
                tempPath.push(p);
                // Find label for this part if it's a root
                let label = p;
                if (tempPath.length === 1 && mediaTree[p] && mediaTree[p].__label) {
                    label = mediaTree[p].__label;
                }

                const pathCopy = [...tempPath];
                breadcrumbDiv.innerHTML += ` / <span onclick='navigateTo(${JSON.stringify(pathCopy)})' style="cursor: pointer;">${label}</span>`;
            });
            grid.appendChild(breadcrumbDiv);

            // Traverse
            let level = mediaTree;
            let validPath = true;

            // Special handling: Top level is "mediaTree", which contains roots as keys.
            // Level 0: [Root1, Root2]
            // Level 1+: contents of Root

            if (currentPath.length === 0) {
                // Show Roots
                level = mediaTree;
            } else {
                // Dive in
                for (const p of currentPath) {
                    // For the first step (root selection), check direct key presence
                    if (level === mediaTree) { // If we are at the top-level mediaTree
                        if (level[p]) {
                            level = level[p].__content;
                        } else { validPath = false; break; }
                    } else { // If we are inside a root's content
                        // Standard folder traversal
                        if (level[p] && level[p].__type === 'folder') {
                            level = level[p].__content;
                        } else {
                            validPath = false;
                            break;
                        }
                    }
                }
            }

            if (!validPath) {
                currentPath = [];
                level = mediaTree;
            }

            const entries = Object.entries(level).sort((a, b) => {
                const aIsFolder = (a[1].__type === 'folder' || (currentPath.length === 0 && mediaTree[a[0]])); // Roots are folders
                const bIsFolder = (b[1].__type === 'folder' || (currentPath.length === 0 && mediaTree[b[0]]));
                if (aIsFolder && !bIsFolder) return -1;
                if (!aIsFolder && bIsFolder) return 1;

                // Sort by Label if available, else Key
                const labelA = a[1].__label || a[0];
                const labelB = b[1].__label || b[0];
                return labelA.localeCompare(labelB);
            });

            if (entries.length === 0) {
                grid.innerHTML += '<p style="color: #64748b;">Empty library. Add folders/files.</p>';
                return;
            }

            entries.forEach(([key, data]) => {
                const el = document.createElement('div');
                el.style.cssText = "background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; overflow: hidden; transition: transform 0.2s; cursor: pointer;";
                el.onmouseover = () => el.style.transform = "scale(1.02)";
                el.onmouseout = () => el.style.transform = "scale(1)";

                const isRoot = currentPath.length === 0;
                const isFolder = data.__type === 'folder' || isRoot;
                const label = data.__label || key;

                if (isFolder) {
                    // FOLDER / ROOT CARD
                    el.onclick = () => {
                        currentPath.push(key);
                        renderCurrentPath();
                    };
                    el.innerHTML = `
                         <div style="height: 100px; background: rgba(59, 130, 246, 0.1); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--accent);">
                            ${isRoot ? '💽' : '📂'}
                        </div>
                        <div style="padding: 12px;">
                            <h4 style="margin: 0; font-size: 0.9rem; text-align: center; color: var(--text-primary);">${label}</h4>
                            ${isRoot ? `<p style="margin:4px 0 0 0; font-size: 0.7rem; text-align: center; color: var(--text-secondary); opacity: 0.7;">${key}</p>` : ''}
                        </div>
                    `;
                } else {
                    // FILE CARD
                    const item = data;
                    let icon = '🎬';
                    if (item.media_type === 'audio') icon = '🎵';
                    if (item.media_type === 'image') icon = '🖼️';

                    el.onclick = (e) => {
                        if (e.target.tagName !== 'A') openPlayer(item);
                    };

                    el.innerHTML = `
                        <div style="height: 120px; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); display: flex; align-items: center; justify-content: center; font-size: 3rem;">
                            ${icon}
                        </div>
                        <div style="padding: 16px;">
                            <h4 style="margin: 0 0 4px 0; font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f8fafc;" title="${item.title}">${item.title}</h4>
                            <p style="margin: 0 0 10px 0; font-size: 0.75rem; color: #94a3b8; text-transform: capitalize;">${item.media_type}</p>
                        </div>
                    `;
                }
                grid.appendChild(el);
            });
        }

        function navigateTo(path) {
            currentPath = path;
            renderCurrentPath();
        }

        // --- Player Modal ---
        // --- Player Modal ---
        // --- Player Modal ---
        function openPlayer(item) {
            const url = `/media/${item.id}/${encodeURIComponent(item.filename)}`;

            const modal = document.createElement('div');
            modal.style.cssText = "position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;";
            modal.id = "player-modal";

            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

            let content = '';
            if (item.media_type === 'video') {
                let tracksHtml = '';
                if (item.subtitle_tracks > 0) {
                    for (let i = 0; i < item.subtitle_tracks; i++) {
                        tracksHtml += `<track label="Subtitle Track ${i + 1}" kind="subtitles" srclang="en" src="/api/media/${item.id}/subtitles/${i}">`;
                    }
                }

                content = `
                    <div style="position: relative; width: 100%; max-width: 1000px; display: flex; flex-direction: column; align-items: center;">
                        <video id="pydlna-video" src="${url}" controls autoplay playsinline preload="metadata" 
                            style="max-width: 100%; max-height: 70vh; border-radius: 8px; box-shadow: 0 0 50px rgba(0,0,0,1);"
                            onerror="this.style.display='none'; document.getElementById('vid-error').style.display='block';">
                            ${tracksHtml}
                        </video>
                        <div id="vid-error" style="display: none; color: #f87171; text-align: center; padding: 40px; background: #1e293b; border-radius: 8px; max-width: 600px;">
                            <h3 style="margin-top:0;">Browser Playback Failed</h3>
                            <p>This format isn't supported by your browser natively.</p>
                            
                            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px;">
                               <a href="vlc://${url.replace(/^https?:\/\//, '')}" class="btn" style="background: #e11d48; color: white;" title="Try opening directly in VLC (requires VLC app)">
                                  Play in VLC
                               </a>
                               <a href="/api/media/${item.id}/play.m3u" class="btn" style="background: #10b981; color: white;" title="Download playlist to open in any system player">
                                  Download Playlist (.m3u)
                               </a>
                               <button class="btn" onclick="copyStreamUrl(${item.id}, '${item.filename.replace(/'/g, "\\'")}')" style="background: #6366f1; color: white;">
                                  Copy Link
                               </button>
                            </div>
                            <p style="font-size: 0.8rem; margin-top: 15px; color: var(--text-secondary);">
                                Most MKV files require an external player like VLC. <br>
                                If 'Play in VLC' doesn't work, use 'Download Playlist' or 'Copy Link' into your player.
                            </p>
                        </div>
                        ${item.audio_tracks > 1 ? `<p style="color: #94a3b8; font-size: 0.8rem; margin-top: 10px;">ℹ️ Multiple audio tracks detected. Use 'Play in Local Player' for full control.</p>` : ''}
                    </div>`;
            } else if (item.media_type === 'audio') {
                content = `
                    <div style="font-size: 5rem; margin-bottom: 20px;">🎵</div>
                    <audio src="${url}" controls autoplay style="width: 100%; max-width: 500px;"></audio>
                `;
            } else {
                content = `<img src="${url}" style="max-width: 100%; max-height: 70vh; border-radius: 8px; box-shadow: 0 0 50px rgba(0,0,0,1);">`;
            }

            modal.innerHTML = `
                <div style="width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="margin: 0; color: white; font-size: 1.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.title}</h2>
                    <button onclick="document.getElementById('player-modal').remove()" style="background: none; border: none; color: white; font-size: 2rem; cursor: pointer;">&times;</button>
                </div>
                ${content}
                <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <a href="vlc://${url.replace(/^https?:\/\//, '')}" class="btn" style="background: #e11d48; color: white;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        Play in VLC
                    </a>
                    <a href="/api/media/${item.id}/play.m3u" class="btn" style="background: #10b981; color: white;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3L7 21M17 3L17 21M3 7L21 7M3 17L21 17"/></svg>
                        Playlist (.m3u)
                    </a>
                    <button class="btn" onclick="copyStreamUrl(${item.id}, '${item.filename.replace(/'/g, "\\'")}')" style="background: #6366f1; color: white;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                        Copy Link
                    </button>
                    <a href="${url}" download class="btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Download
                    </a>
                </div>
            `;

            document.body.appendChild(modal);
        }

        function renderPaths(paths) {
            const list = document.getElementById('path-list');
            list.innerHTML = '';
            if (paths.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #475569; padding: 20px;">No libraries added yet.</p>';
            }
            paths.forEach(p => {
                const div = document.createElement('div');
                div.className = 'path-item';
                div.innerHTML = `
                    <span>${p}</span> 
                    <svg class="remove-icon" onclick="removePath('${p.replace(/\\/g, '\\\\')}')" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                `;
                list.appendChild(div);
            });
            window.currentPaths = paths;
        }

        async function handleDirAdd() {
            if (window.pywebview && window.pywebview.api) {
                // Use Native Dialog
                const result = await window.pywebview.api.select_folder();
                if (result) {
                    showToast("Folder added successfully");
                    loadSettings();
                }
            } else {
                // Use Web Input
                const input = document.getElementById('new-path');
                const path = input.value;
                if (!path) return;
                const newPaths = [...(window.currentPaths || []), path];
                await updatePaths(newPaths);
                input.value = '';
            }
        }

        async function removePath(pathToRemove) {
            const newPaths = window.currentPaths.filter(p => p !== pathToRemove);
            await updatePaths(newPaths);
        }

        async function updatePaths(paths) {
            const res = await fetch('/api/settings/paths', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paths })
            });
            if (res.ok) {
                loadSettings();
                showToast("Library updated.");
            }
        }

        async function saveGeneralSettings() {
            const name = document.getElementById('server-name').value;
            const port = parseInt(document.getElementById('server-port').value);

            if (isNaN(port)) {
                showToast("Error: Port must be a number.");
                return;
            }

            const res = await fetch('/api/settings/general', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    friendly_name: name,
                    port: port
                })
            });
            if (res.ok) {
                showToast("Settings saved. Server will refresh...");
                setTimeout(() => window.location.reload(), 1500);
            }
        }

        async function control(action) {
            if (action === 'stop' && !confirm("Shut down the server?")) return;
            if (action === 'clear_cache' && !confirm("Wipe the entire media library cache? You will need to rescan to see your files again.")) return;

            const res = await fetch(`/api/control/${action}`, { method: 'POST' });
            if (res.ok) {
                let msg = "";
                if (action === 'stop') msg = "Server stopping...";
                else if (action === 'rescan') msg = "Rescanning library...";
                else if (action === 'clear_cache') {
                    msg = "Library cache cleared.";
                    loadLibrary(); // Refresh the browse grid
                }
                showToast(msg);
            }
        }

        function copyStreamUrl(itemId, filename) {
            const url = window.location.origin + `/media/${itemId}/${encodeURIComponent(filename)}`;

            // Fallback for non-HTTPS / non-secure contexts
            const textArea = document.createElement("textarea");
            textArea.value = url;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("Link copied to clipboard!");
            } catch (err) {
                showToast("Failed to copy link.");
            }
            document.body.removeChild(textArea);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function launchServer() {
            const port = document.getElementById('new-port').value || '8201';
            alert("Launch this from terminal:\npython -m pydlna.main --port " + port + " --config config_" + port + ".json");
        }

        // Init
        loadSettings();
        loadLibrary();
    </script>
</body>

</html>
